<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0C0B0A" />
      <stop offset="50%" stop-color="#141312" />
      <stop offset="100%" stop-color="#1B1A19" />
    </linearGradient>
    <radialGradient id="glow1" cx="30%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.32" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#34D399" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#34D399" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#glow1)" />
  <rect width="1200" height="630" fill="url(#glow2)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630" />
    <line x1="300" y1="0" x2="300" y2="630" />
    <line x1="500" y1="0" x2="500" y2="630" />
    <line x1="700" y1="0" x2="700" y2="630" />
    <line x1="900" y1="0" x2="900" y2="630" />
    <line x1="1100" y1="0" x2="1100" y2="630" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="400" x2="1200" y2="400" />
    <line x1="0" y1="550" x2="1200" y2="550" />
  </g>

  <!-- Badge -->
  <g transform="translate(100, 100)">
    <rect width="320" height="38" rx="19" fill="#1B1A19" stroke="rgba(255,255,255,0.14)" stroke-width="1" />
    <circle cx="20" cy="19" r="5" fill="#34D399" />
    <text x="36" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#9B9690" letter-spacing="0.5">OPEN SOURCE · FREE · PRIVACY-FIRST</text>
  </g>

  <!-- Logo Mark + Wordmark -->
  <g transform="translate(100, 175)">
    <rect width="64" height="64" rx="16" fill="#6366F1" />
    <path d="M16 32h32M32 16l16 16-16 16" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <text x="88" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.5"><tspan fill="#FFFFFF">Next</tspan><tspan fill="#818CF8">Share</tspan></text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="700" fill="#F0EDE8" letter-spacing="-1">
    Share links, files &amp; code. Instantly.
  </text>

  <!-- Subheadline -->
  <text x="100" y="375" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9B9690">
    Three developer utilities in one unified tool. No accounts. Zero tracking.
  </text>
  <text x="100" y="410" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="400" fill="#9B9690">
    Sub-100ms Redis redirects · Encrypted file streaming · Burn-after-read pastes.
  </text>

  <!-- Feature Pills -->
  <g transform="translate(100, 480)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="48" rx="10" fill="#1B1A19" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="24" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F0EDE8">🔗 URL Shortener</text>

    <!-- Pill 2 -->
    <rect x="240" y="0" width="220" height="48" rx="10" fill="#1B1A19" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="264" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F0EDE8">📁 File Sharing</text>

    <!-- Pill 3 -->
    <rect x="480" y="0" width="220" height="48" rx="10" fill="#1B1A19" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="504" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#F0EDE8">⚡ Code Paste</text>

    <!-- Pill 4 -->
    <rect x="720" y="0" width="220" height="48" rx="10" fill="#1B1A19" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
    <text x="744" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="600" fill="#34D399">📱 Offline PWA</text>
  </g>

  <!-- Footer Attribution -->
  <text x="100" y="585" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#4E4B47">
    nextsharebymeet.vercel.app · Created by Meet Maru
  </text>
</svg>
